<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chess Game</title>

    <link rel="stylesheet" href="chess.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="../image/logo.jpg" type="image/x-icon" />

    <!-- Boxicons -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <!-- ================= HEADER ================= -->
      <header class="header">
        <div class="logo">
          <span>Chess</span>
        </div>

        <nav class="nav">
          <a class="active" href="../chooseGames.html">
            <i class="bx bxs-home"></i>
            Home
          </a>

          <a href="#game">
            <i class="bx bxs-caret-right-circle"></i>
            Play
          </a>

          <a href="#learn">
            <i class="bx bx-book-open"></i>
            Learn
          </a>
        </nav>
      </header>

      <!-- ================= MAIN GAME ================= -->
      <main class="main">
        <!-- LEFT PANEL -->
        <section class="left-panel">
          <!-- BLACK PLAYER -->
          <div class="player-card black-player">
            <div class="player-info">
              <div class="player-avatar black-avatar">
                <i class="bx bxs-user"></i>
              </div>

              <div>
                <h3>Black</h3>
                <span>Player</span>
              </div>
            </div>

            <div class="timer" id="blackTimer">10:00</div>
          </div>

          <div class="vs">
            <span></span>
            VS
            <span></span>
          </div>

          <!-- WHITE PLAYER -->
          <div class="player-card white-player">
            <div class="player-info">
              <div class="player-avatar white-avatar">
                <i class="bx bxs-user"></i>
              </div>

              <div>
                <h3>White</h3>
                <span>You</span>
              </div>
            </div>

            <div class="timer" id="whiteTimer">10:00</div>
          </div>

          <!-- GAME CONTROLS -->
          <div class="control-box">
            <h3>Game Controls</h3>

            <button class="main-btn" id="newGameBtn">
              <i class="bx bx-play"></i>
              New Game
            </button>

            <button class="control-btn" id="resetBtn">
              <i class="bx bx-reset"></i>
              Reset
            </button>

            <button class="control-btn" id="undoBtn">
              <i class="bx bx-undo"></i>
              Undo
            </button>

            <button class="control-btn" id="settingsBtn">
              <i class="bx bx-cog"></i>
              Settings
            </button>
          </div>
        </section>

        <!-- ================= BOARD ================= -->
        <section class="board-section" id="game">
          <div class="board-container">
            <div class="board" id="board"></div>
          </div>

          <div class="mobile-turn" id="mobileTurn">White's Turn</div>
        </section>

        <!-- ================= RIGHT PANEL ================= -->
        <section class="right-panel">
          <!-- GAME INFO -->
          <div class="info-card">
            <div class="card-title">
              <h2>Game Info</h2>
              <i class="bx bx-chess"></i>
            </div>

            <div class="game-info">
              <div class="info-row">
                <div class="info-icon">
                  <i class="bx bx-refresh"></i>
                </div>

                <div>
                  <strong>Standard</strong>
                  <span>Game Mode</span>
                </div>
              </div>

              <div class="info-row">
                <div class="info-icon">
                  <i class="bx bxs-circle"></i>
                </div>

                <div>
                  <strong id="turnText">White Turn</strong>
                  <span>Current Move</span>
                </div>
              </div>
            </div>
          </div>

          <!-- MOVE HISTORY -->
          <div class="info-card history-card">
            <div class="card-title">
              <h2>Move History</h2>
            </div>

            <div class="history" id="moveHistory">
              <p class="empty-history">No moves yet</p>
            </div>
          </div>

          <!-- CAPTURED -->
          <div class="info-card">
            <div class="card-title">
              <h2>Captured Pieces</h2>
            </div>

            <div class="captured-container">
              <div class="captured-side">
                <span>White</span>

                <div id="whiteCaptured" class="captured-pieces"></div>
              </div>

              <div class="captured-side">
                <span>Black</span>

                <div id="blackCaptured" class="captured-pieces"></div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- ================= BOTTOM SECTION ================= -->
    </div>

    <!-- PROMOTION MODAL -->
    <div class="promotion-modal" id="promotionModal">
      <div class="promotion-box">
        <h2>Choose Promotion</h2>

        <div class="promotion-options">
          <button data-piece="q">♕</button>
          <button data-piece="r">♖</button>
          <button data-piece="b">♗</button>
          <button data-piece="n">♘</button>
        </div>
      </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="game-modal" id="gameModal">
      <div class="game-modal-box">
        <div class="modal-icon">🏆</div>

        <h2 id="modalTitle">You Win!</h2>

        <p id="modalText">Checkmate</p>

        <button id="modalNewGame">Play Again</button>
      </div>
    </div>

    <script src="chess.js"></script>
  </body>
</html>
