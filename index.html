<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="image/logo.jpg" type="image/x-icon" />

    <title>Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0f0f1a;
      }

      .container {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        margin: 15px;
        background: #d7d7e2;
        border-radius: 20px;

        box-shadow:
          10px 10px 20px #7c3aed,
          -10px -10px 20px #a855f7;
      }

      .title {
        text-align: center;
        margin-bottom: 30px;
        color: #7c3aed;
        font-weight: 600;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-group {
        display: flex;
        align-items: center;
        gap: 10px;

        margin-bottom: 20px;
        padding: 15px 20px;

        background: #d7d7e2;
        border-radius: 15px;

        box-shadow:
          inset 5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;
      }

      .input-group i {
        color: #7c3aed;
        font-size: 20px;
      }

      .input-group input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
      }

      .input-group input::placeholder {
        color: #7c3aed;
      }

      .btn {
        width: 100%;
        padding: 15px;

        border: none;
        outline: none;

        background: #d7d7e2;
        border-radius: 15px;

        font-size: 16px;
        font-weight: 600;
        color: #7c3aed;

        cursor: pointer;

        box-shadow:
          5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;

        transition: 0.3s;

        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn:hover {
        box-shadow:
          inset 5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .register-link {
        margin-top: 20px;
        text-align: center;
        color: #555;
      }

      .register-link a {
        color: #7c3aed;
        text-decoration: none;
        font-weight: 600;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .container {
          padding: 30px 20px;
        }

        .title {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2 class="title">Log In</h2>

      <form id="loginForm">
        <!-- Username -->
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required />
        </div>

        <!-- Password -->
        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="btn">Log In</button>
      </form>

      <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
      </div>
    </div>

    <script>
      // localStorage user yuu
      const users = localStorage.getItem("users")
        ? JSON.parse(localStorage.getItem("users"))
        : [
            {
              userName: "Lily",
              password: "123456",
            },
          ];

      const loginForm = document.getElementById("loginForm"); //form id

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault(); //page refresh malok aung

        const username = document.getElementById("username").value.trim(); //user value yuu
        const password = document.getElementById("password").value; //password yuu

        // Username find
        const loginUser = users.find((user) => user.userName === username);

        // User not found
        if (!loginUser) {
          alert("User not found!");
          return;
        }

        // check Password
        if (loginUser.password === password) {
          alert("Log in successful!");

          // Game selection page
          window.location.href = "chooseGames.html";
        } else {
          alert("Username or Password is incorrect!");
        }
      });
    </script>
  </body>
</html>
