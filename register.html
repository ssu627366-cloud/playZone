<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="image/logo.jpg" type="image/x-icon" />

    <title>Register</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0f0f1a;
      }

      .container {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        margin: 15px;

        background: #d7d7e2;

        border-radius: 20px;

        box-shadow:
          10px 10px 20px #7c3aed,
          -10px -10px 20px #a855f7;
      }

      .title {
        text-align: center;
        margin-bottom: 30px;

        color: #7c3aed;

        font-weight: 600;
        font-size: 28px;

        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .input-group {
        display: flex;
        align-items: center;
        gap: 10px;

        margin-bottom: 20px;
        padding: 15px 20px;

        background: #d7d7e2;

        border-radius: 15px;

        box-shadow:
          inset 5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;
      }

      .input-group i {
        color: #7c3aed;
        font-size: 20px;
      }

      .input-group input {
        width: 100%;

        border: none;
        outline: none;

        background: transparent;

        font-size: 16px;
      }

      .input-group input::placeholder {
        color: #7c3aed;
      }

      .btn {
        width: 100%;

        padding: 15px;

        border: none;
        outline: none;

        background: #d7d7e2;

        border-radius: 15px;

        font-size: 16px;
        font-weight: 600;

        color: #7c3aed;

        cursor: pointer;

        box-shadow:
          5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;

        transition: 0.3s;

        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn:hover {
        box-shadow:
          inset 5px 5px 10px #7c3aed,
          inset -5px -5px 10px #a855f7;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .login-link {
        margin-top: 20px;

        text-align: center;

        color: #555;
      }

      .login-link a {
        color: #7c3aed;

        text-decoration: none;

        font-weight: 600;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .container {
          padding: 30px 20px;
          margin: 15px;
        }

        .title {
          font-size: 24px;
        }

        .input-group {
          padding: 13px 15px;
        }

        .btn {
          padding: 13px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2 class="title">Register</h2>

      <form id="registerForm">
        <!-- Username -->
        <div class="input-group">
          <input type="text" id="username" placeholder="Username" required />
        </div>

        <!-- Password -->
        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
          />
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn">Register</button>
      </form>

      <!-- Login Link -->
      <div class="login-link">
        Already have an account?
        <a href="index.html">Login</a>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      registerForm.addEventListener("submit", function (event) {
        event.preventDefault();

        // Get input values
        const username = document.getElementById("username").value.trim();

        const password = document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        // Check password
        if (password !== confirmPassword) {
          alert("Passwords do not match!");

          return;
        }

        // Get users from localStorage
        const users = localStorage.getItem("users")
          ? JSON.parse(localStorage.getItem("users"))
          : []; //shi yin js array yu ma shi yin htar

        // Check existing username
        const existingUser = users.find((user) => user.userName === username);

        if (existingUser) {
          alert("Username already exists!");

          return;
        }

        // Create new user
        const newUser = {
          userName: username,
          password: password,
        };

        // Add user
        users.push(newUser);

        // Save to localStorage
        localStorage.setItem("users", JSON.stringify(users));

        // Success
        alert("Registration successful!");

        // Go to Login page
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
